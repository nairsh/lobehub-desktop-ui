name: Desktop Manual Build

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel for desktop build (affects version suffix and workflow:set-desktop-version)'
        required: true
        default: canary
        type: choice
        options:
          - canary
          - beta
          - stable
      build_macos:
        description: 'Build macOS artifacts'
        required: true
        default: true
        type: boolean
      build_windows:
        description: 'Build Windows artifacts'
        required: true
        default: true
        type: boolean
      build_linux:
        description: 'Build Linux artifacts'
        required: true
        default: true
        type: boolean
      version:
        description: 'Override desktop version (e.g. 1.2.3). Leave empty to auto-generate.'
        required: false
        default: ''
      publish_release:
        description: 'Create a GitHub Release and upload built artifacts'
        required: true
        default: true
        type: boolean
      prerelease:
        description: 'Mark created release as pre-release'
        required: true
        default: true
        type: boolean
      release_notes:
        description: 'Release notes body (optional). Leave empty to use auto-generated notes.'
        required: false
        default: ''

concurrency:
  group: manual-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24.11.1

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set version
        id: set_version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          base_version=$(node -p "require('./apps/desktop/package.json').version")

          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
            echo "📦 Using provided version: ${version} (base: ${base_version})"
          else
            ci_build_number="${{ github.run_number }}"
            if [ "$CHANNEL" = "beta" ]; then
              channel_suffix="next"
            else
              channel_suffix="$CHANNEL"
            fi

            if [[ "$base_version" == *"-${channel_suffix}"* ]]; then
              version="${base_version}.manual.${ci_build_number}"
            else
              version="${base_version}-${channel_suffix}.manual.${ci_build_number}"
            fi
            echo "📦 Generated version: ${version} (base: ${base_version})"
          fi

          echo "version=${version}" >> $GITHUB_OUTPUT

      - name: Version Summary
        run: |
          echo "🚦 Release Version: ${{ steps.set_version.outputs.version }}"

  build-macos:
    needs: [version]
    name: Build Desktop App (macOS)
    if: inputs.build_macos
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v6

      - name: Setup build environment
        uses: ./.github/actions/desktop-build-setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set package version
        run: npm run workflow:set-desktop-version ${{ needs.version.outputs.version }} ${{ inputs.channel }}

      - name: Build artifact on macOS
        run: npm run desktop:package:app
        env:
          UPDATE_CHANNEL: ${{ inputs.channel }}
          APP_URL: http://localhost:3015
          DATABASE_URL: 'postgresql://postgres@localhost:5432/postgres'
          KEY_VAULTS_SECRET: 'oLXWIiR/AKF+rWaqy9lHkrYgzpATbW3CtJp3UfkVgpE='
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          NEXT_PUBLIC_DESKTOP_PROJECT_ID: ${{ inputs.channel == 'stable' && secrets.UMAMI_STABLE_DESKTOP_PROJECT_ID || secrets.UMAMI_BETA_DESKTOP_PROJECT_ID }}
          NEXT_PUBLIC_DESKTOP_UMAMI_BASE_URL: ${{ inputs.channel == 'stable' && secrets.UMAMI_STABLE_DESKTOP_BASE_URL || secrets.UMAMI_BETA_DESKTOP_BASE_URL }}
          CSC_FOR_PULL_REQUEST: true
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Rename macOS latest-mac.yml for multi-architecture support
        if: runner.os == 'macOS'
        run: |
          cd apps/desktop/release
          if [ -f "latest-mac.yml" ]; then
            SYSTEM_ARCH=$(uname -m)
            if [[ "$SYSTEM_ARCH" == "arm64" ]]; then
              ARCH_SUFFIX="arm64"
            else
              ARCH_SUFFIX="x64"
            fi

            mv latest-mac.yml "latest-mac-${ARCH_SUFFIX}.yml"
            echo "✅ Renamed latest-mac.yml to latest-mac-${ARCH_SUFFIX}.yml (detected: $SYSTEM_ARCH)"
            ls -la latest-mac-*.yml
          else
            echo "⚠️ latest-mac.yml not found, skipping rename"
            ls -la latest*.yml || echo "No latest*.yml files found"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.os }}
          path: |
            apps/desktop/release/latest*
            apps/desktop/release/*.dmg*
            apps/desktop/release/*.zip*
            apps/desktop/release/*.exe*
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb*
            apps/desktop/release/*.snap*
            apps/desktop/release/*.rpm*
            apps/desktop/release/*.tar.gz*
          retention-days: 5

  build-windows:
    needs: [version]
    name: Build Desktop App (Windows)
    if: inputs.build_windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6

      - name: Setup build environment
        uses: ./.github/actions/desktop-build-setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set package version
        run: npm run workflow:set-desktop-version ${{ needs.version.outputs.version }} ${{ inputs.channel }}

      - name: Build artifact on Windows
        run: npm run desktop:package:app
        env:
          UPDATE_CHANNEL: ${{ inputs.channel }}
          APP_URL: http://localhost:3015
          DATABASE_URL: 'postgresql://postgres@localhost:5432/postgres'
          KEY_VAULTS_SECRET: 'oLXWIiR/AKF+rWaqy9lHkrYgzpATbW3CtJp3UfkVgpE='
          NEXT_PUBLIC_DESKTOP_PROJECT_ID: ${{ inputs.channel == 'stable' && secrets.UMAMI_STABLE_DESKTOP_PROJECT_ID || secrets.UMAMI_BETA_DESKTOP_PROJECT_ID }}
          NEXT_PUBLIC_DESKTOP_UMAMI_BASE_URL: ${{ inputs.channel == 'stable' && secrets.UMAMI_STABLE_DESKTOP_BASE_URL || secrets.UMAMI_BETA_DESKTOP_BASE_URL }}
          TEMP: C:\temp
          TMP: C:\temp

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-windows-2025
          path: |
            apps/desktop/release/latest*
            apps/desktop/release/*.dmg*
            apps/desktop/release/*.zip*
            apps/desktop/release/*.exe*
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb*
            apps/desktop/release/*.snap*
            apps/desktop/release/*.rpm*
            apps/desktop/release/*.tar.gz*
          retention-days: 5

  build-linux:
    needs: [version]
    name: Build Desktop App (Linux)
    if: inputs.build_linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup build environment
        uses: ./.github/actions/desktop-build-setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set package version
        run: npm run workflow:set-desktop-version ${{ needs.version.outputs.version }} ${{ inputs.channel }}

      - name: Build artifact on Linux
        run: npm run desktop:package:app
        env:
          UPDATE_CHANNEL: ${{ inputs.channel }}
          APP_URL: http://localhost:3015
          DATABASE_URL: 'postgresql://postgres@localhost:5432/postgres'
          KEY_VAULTS_SECRET: 'oLXWIiR/AKF+rWaqy9lHkrYgzpATbW3CtJp3UfkVgpE='
          NEXT_PUBLIC_DESKTOP_PROJECT_ID: ${{ inputs.channel == 'stable' && secrets.UMAMI_STABLE_DESKTOP_PROJECT_ID || secrets.UMAMI_BETA_DESKTOP_PROJECT_ID }}
          NEXT_PUBLIC_DESKTOP_UMAMI_BASE_URL: ${{ inputs.channel == 'stable' && secrets.UMAMI_STABLE_DESKTOP_BASE_URL || secrets.UMAMI_BETA_DESKTOP_BASE_URL }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-ubuntu-latest
          path: |
            apps/desktop/release/latest*
            apps/desktop/release/*.dmg*
            apps/desktop/release/*.zip*
            apps/desktop/release/*.exe*
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb*
            apps/desktop/release/*.snap*
            apps/desktop/release/*.rpm*
            apps/desktop/release/*.tar.gz*
          retention-days: 5

  merge-mac-files:
    needs: [build-macos, version]
    name: Merge macOS Release Files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: inputs.build_macos
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: release
          pattern: release-*
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -R release

      - name: Install yaml only for merge step
        run: |
          cd scripts/electronWorkflow
          if [ ! -f package.json ]; then
            echo '{"name":"merge-mac-release","private":true}' > package.json
          fi
          bun add --no-save yaml@2.8.1

      - name: Merge latest-mac.yml files
        run: bun run scripts/electronWorkflow/mergeMacReleaseFiles.js

      - name: Upload artifacts with merged macOS files
        uses: actions/upload-artifact@v6
        with:
          name: merged-release-manual
          path: release/
          retention-days: 1

  publish-release:
    needs: [version, build-macos, build-windows, build-linux, merge-mac-files]
    name: Publish Desktop Release
    runs-on: ubuntu-latest
    if: >-
      ${{
        always() &&
        inputs.publish_release &&
        needs.version.result == 'success' &&
        (needs['build-macos'].result == 'success' || needs['build-macos'].result == 'skipped') &&
        (needs['build-windows'].result == 'success' || needs['build-windows'].result == 'skipped') &&
        (needs['build-linux'].result == 'success' || needs['build-linux'].result == 'skipped') &&
        (needs['merge-mac-files'].result == 'success' || needs['merge-mac-files'].result == 'skipped')
      }}
    permissions:
      contents: write
    steps:
      - name: Download merged artifacts (when macOS build enabled)
        if: inputs.build_macos
        uses: actions/download-artifact@v7
        with:
          name: merged-release-manual
          path: release

      - name: Download artifacts (when macOS build disabled)
        if: ${{ !inputs.build_macos }}
        uses: actions/download-artifact@v7
        with:
          path: release
          pattern: release-*
          merge-multiple: true

      - name: List final artifacts
        run: ls -R release

      - name: Prepare release notes
        id: notes
        env:
          RELEASE_NOTES_INPUT: ${{ inputs.release_notes }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ needs.version.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$RELEASE_NOTES_INPUT" ]; then
            {
              echo "body<<EOF"
              printf '%s\n' "$RELEASE_NOTES_INPUT"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "body<<EOF"
              echo "## Desktop ${CHANNEL} manual build"
              echo
              echo "- Version: \`${VERSION}\`"
              echo "- Source ref: \`${REF_NAME}\`"
              echo "- Workflow run: ${RUN_URL}"
              echo
              echo "Artifacts were generated by the manual desktop workflow and attached automatically."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release asset patterns
        id: assets
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          case "$CHANNEL" in
            stable)
              channel_assets=$'release/latest*.yml\nrelease/stable*.yml'
              ;;
            canary)
              channel_assets=$'release/latest*.yml\nrelease/canary*.yml'
              ;;
            *)
              channel_assets='release/latest*.yml'
              ;;
          esac

          {
            echo "files<<EOF"
            printf '%s\n' "$channel_assets"
            echo "release/*.dmg*"
            echo "release/*.zip*"
            echo "release/*.exe*"
            echo "release/*.AppImage"
            echo "release/*.deb*"
            echo "release/*.snap*"
            echo "release/*.rpm*"
            echo "release/*.tar.gz*"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Desktop ${{ needs.version.outputs.version }}
          prerelease: ${{ inputs.prerelease }}
          body: ${{ steps.notes.outputs.body }}
          files: ${{ steps.assets.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
