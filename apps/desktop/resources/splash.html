<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Composer</title>
    <style>
      .drag-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 48px;
        -webkit-app-region: drag;
      }

      body {
        --brand-color: #1f1f1f;
        margin: 0;
        padding: 48px 0 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: var(--brand-color);
        overflow: hidden;
      }

      @media (prefers-color-scheme: dark) {
        body {
          --brand-color: #f5f5f5;
        }
      }

      .container {
        text-align: center;
      }

      .brand-wordmark {
        display: inline-flex;
        font-size: 46px;
        font-weight: 700;
        letter-spacing: 0.01em;
        line-height: 1;
        user-select: none;
        color: transparent;
        -webkit-text-stroke: 1.2px var(--brand-color);
        animation: fill-text 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes fill-text {
        30% {
          color: transparent;
        }

        100% {
          color: var(--brand-color);
        }
      }
    </style>
  </head>
  <body>
    <div class="drag-bar"></div>
    <div class="container">
      <span class="brand-wordmark">Composer</span>
    </div>
  </body>
</html>
